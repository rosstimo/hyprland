$category = Workspace: 
# --- Workspace switching ---
bindd = $mainMod, 1, $category Switch to 1 , workspace, 1
bindd = $mainMod, 2, $category Switch to 2 , workspace, 2
bindd = $mainMod, 3, $category Switch to 3 , workspace, 3
bindd = $mainMod, 4, $category Switch to 4 , workspace, 4
bindd = $mainMod, 5, $category Switch to 5 , workspace, 5
bindd = $mainMod, 6, $category Switch to 6 , workspace, 6
bindd = $mainMod, 7, $category Switch to 7 , workspace, 7
bindd = $mainMod, 8, $category Switch to 8 , workspace, 8
bindd = $mainMod, 9, $category Switch to 9 , workspace, 9

# --- Move window to workspace ---
bindd = $mainMod SHIFT, 1, $category Move Window to 1 , movetoworkspace, 1
bindd = $mainMod SHIFT, 2, $category Move Window to 2 , movetoworkspace, 2
bindd = $mainMod SHIFT, 3, $category Move Window to 3 , movetoworkspace, 3
bindd = $mainMod SHIFT, 4, $category Move Window to 4 , movetoworkspace, 4
bindd = $mainMod SHIFT, 5, $category Move Window to 5 , movetoworkspace, 5
bindd = $mainMod SHIFT, 6, $category Move Window to 6 , movetoworkspace, 6
bindd = $mainMod SHIFT, 7, $category Move Window to 7 , movetoworkspace, 7
bindd = $mainMod SHIFT, 8, $category Move Window to 8 , movetoworkspace, 8
bindd = $mainMod SHIFT, 9, $category Move Window to 9 , movetoworkspace, 9

# --- Special workspace (scratchpad) ---
bindd = $mainMod, S, $category Toggle Special , togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, $category Move Window to Special , movetoworkspace, special:magic

# --- Workspace scrolling ---
bindd = $mainMod, mouse_down, $category Scroll Down , workspace, e+1
bindd = $mainMod, mouse_up, $category Scroll Up , workspace, e-1
