# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
#env = GDK_SCALE,2
#monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# Tim R
env = GDK_SCALE,2
env = QT_AUTO_SCREEN_SCALE_FACTOR,2
monitor = ,preferred,auto,auto
monitor = eDP-1,preferred,auto,2
monitor = DP-5,preferred,auto,1
monitor = DP-6,preferred,auto,1
monitor = DP-7,preferred,auto,1


# monitor = ,1920x1080,auto,2,mirror,eDP-1

# disable laptop main display when lid closes
 unbind = , switch:on:Lid Switch
 unbind = , switch:off:Lid Switch

# trigger when the switch is turning on
#  bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor ", preferred, auto, 2"
 bindld = , switch:off:Lid Switch, Display: Enable Laptop Display, exec, hyprctl keyword monitor "eDP-1, enable"

# trigger when the switch is turning off
 bindld = , switch:on:Lid Switch, Display: Disable Laptop Display, exec, hyprctl keyword monitor "eDP-1, disable"


