# KEYBINDINGS

## Bind flags

# bind supports flags in this format:
# bind[flags] = ...
# e.g.:
# bindrl = MOD, KEY, exec, amongus

## Flags:

# l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
# r -> release, will trigger on release of a key.
# c -> click, will trigger on release of a key or button as long as the mouse cursor stays inside binds:drag_threshold.
# g -> drag, will trigger on release of a key or button as long as the mouse cursor moves outside binds:drag_threshold.
# o -> longPress, will trigger on long press of a key.
# e -> repeat, will repeat when held.
# n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
# m -> mouse, see below.
# t -> transparent, cannot be shadowed by other binds.
# i -> ignore mods, will ignore modifiers.
# s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
# d -> has description, will allow you to write a description for your bind.
# p -> bypasses the app's requests to inhibit keybinds.

# Example Usage:

# # Example volume button that allows press and hold, volume limited to 150%
# binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

# # Example volume button that will activate even while an input inhibitor is active
# bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# # Start wofi opens wofi on first press, closes it on second
# bindr = SUPER, SUPER_L, exec, pkill wofi || wofi

# # Describe a bind
# To add a description to a keybind, use:
# bindd = MOD, KEY, Description, action, [args]
# Example: 
# bindd = SUPER, Q, Kill active window (SUPER+Q), killactive,
# bindd = SUPER, return, Open my favourite terminal (Super+Enter), exec, kitty

# # Skip player on long press and only skip 5s on normal press
# bindo = SUPER, XF86AudioNext, exec, playerctl next
# bind = SUPER, XF86AudioNext, exec, playerctl position +5


# Set programs that you use
$terminal = kitty
$fileManager = thunar
$webBrowser = librewolf
$menu = wofi --show drun

# --- Unbinds & Overrides ---
# Unbind default or conflicting keys before setting new binds
unbind = , F9
unbind = , F10
unbind = , F11
unbind = , F12
unbind = $mainMod, T
unbind = $mainMod, F
unbind = $mainMod, K
unbind = $mainMod, E
unbind = $mainMod, C
unbind = $mainMod, W
unbind = $mainMod, Q
unbind = Alt, F4
unbind = , switch:on:Lid Switch
unbind = , switch:off:Lid Switch

# --- Main modifier ---
$mainMod = SUPER

# --- Launching applications ---
bindd = $mainMod, return, Launch Terminal (Super+Enter), exec, $terminal
bindd = $mainMod, E, Launch File Manager (Super+E), exec, $fileManager
bindd = $mainMod, W, Launch Web Browser (Super+W), exec, $webBrowser

# --- Toggle applications ---
bindrd = CTRL, ESCAPE, Toggle Waybar (CTRL+ESC), exec, pkill waybar || waybar
bindrd= ALT, SPACE, Toggle Application Menu (ALT+SPACE), exec, pkill wofi || wofi --show drun

# --- Window management ---
bindd = $mainMod, Q, Kill active window (SUPER+Q), killactive,
bindd = $mainMod, M, Exit Hyprland (SUPER+M), exec, pkill hyprland
bindd = $mainMod, V, Toggle Floating (SUPER+V), togglefloating,
bindd = $mainMod, P, Pseudo Tile (SUPER+P), pseudo, # dwindle
bindd = $mainMod, J, Toggle Split (SUPER+J), togglesplit 

# --- Focus movement ---
bindd = $mainMod, left, Focus Left (SUPER+LEFT), movefocus, l
bindd = $mainMod, right, Focus Right (SUPER+RIGHT), movefocus, r
bindd = $mainMod, up, Focus Up (SUPER+UP), movefocus, u
bindd = $mainMod, down, Focus Down (SUPER+DOWN), movefocus, d

# --- Workspace switching ---
bindd = $mainMod, 1, Switch to Workspace 1 (SUPER+1), workspace, 1
bindd = $mainMod, 2, Switch to Workspace 2 (SUPER+2), workspace, 2
bindd = $mainMod, 3, Switch to Workspace 3 (SUPER+3), workspace, 3
bindd = $mainMod, 4, Switch to Workspace 4 (SUPER+4), workspace, 4
bindd = $mainMod, 5, Switch to Workspace 5 (SUPER+5), workspace, 5
bindd = $mainMod, 6, Switch to Workspace 6 (SUPER+6), workspace, 6
bindd = $mainMod, 7, Switch to Workspace 7 (SUPER+7), workspace, 7
bindd = $mainMod, 8, Switch to Workspace 8 (SUPER+8), workspace, 8
bindd = $mainMod, 9, Switch to Workspace 9 (SUPER+9), workspace, 9
bindd = $mainMod, 0, Switch to Workspace 10 (SUPER+0), workspace, 10

# --- Move window to workspace ---
bindd = $mainMod SHIFT, 1, Move Active Window to Workspace 1 (SUPER+SHIFT+1), movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move Active Window to Workspace 2 (SUPER+SHIFT+2), movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move Active Window to Workspace 3 (SUPER+SHIFT+3), movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move Active Window to Workspace 4 (SUPER+SHIFT+4), movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move Active Window to Workspace 5 (SUPER+SHIFT+5), movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move Active Window to Workspace 6 (SUPER+SHIFT+6), movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move Active Window to Workspace 7 (SUPER+SHIFT+7), movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move Active Window to Workspace 8 (SUPER+SHIFT+8), movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move Active Window to Workspace 9 (SUPER+SHIFT+9), movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move Active Window to Workspace 10 (SUPER+SHIFT+0), movetoworkspace, 10

# --- Special workspace (scratchpad) ---
bindd = $mainMod, S, Toggle Special Workspace (SUPER+S), togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move Active Window to Special Workspace (SUPER+SHIFT+S), movetoworkspace, special:magic

# --- Workspace scrolling ---
bindd = $mainMod, mouse_down, Workspace Scroll Down (SUPER+MouseDown), workspace, e+1
bindd = $mainMod, mouse_up, Workspace Scroll Up (SUPER+MouseUp), workspace, e-1

# --- Mouse actions ---
bindmd = $mainMod, mouse:272, Move Window (Super+Left Mouse), movewindow
bindmd = $mainMod, mouse:273, Resize Window (Super+Right Mouse), resizewindow

# --- Media and volume controls ---
# Use nerdfont symbols for special function keys descriptions
bindeld = ,XF86AudioRaiseVolume, Volume Up 󰕾, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume, Volume Down , exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = ,XF86AudioMute, Mute 󰖁, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ,XF86AudioMicMute, Mute Microphone 󰖁, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = ,XF86MonBrightnessUp, Brightness Up 󰌬, exec, brightnessctl -e4 -n2 set 5%+
bindeld = ,XF86MonBrightnessDown, Brightness Down 󰌭, exec, brightnessctl -e4 -n2 set 5%-
bindlid = ,XF86AudioNext, Next 󰒬, exec, playerctl next
bindlid = ,XF86AudioPause, Pause 󰏤, exec, playerctl play-pause
bindlid = ,XF86AudioPlay, Play 󰐊, exec, playerctl play-pause
bindlid = ,XF86AudioPrev, Previous 󰒫, exec, playerctl previous
